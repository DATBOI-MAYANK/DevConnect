services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/users/api/v1
        VITE_API_GITHUB_URL: https://api.github.com/repos/
        VITE_API_GITHUB_USERS_URL: https://api.github.com/users/
        VITE_GITHUB_WEB_URL: https://github.com/
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
